---
- name: Assert required secrets are set locally
  ansible.builtin.assert:
    that:
      - quay_db_password | length > 0
      - quay_db_password is not match('^CHANGE_ME')
      - quay_db_admin_password | length > 0
      - quay_db_admin_password is not match('^CHANGE_ME')
      - quay_redis_password | length > 0
      - quay_redis_password is not match('^CHANGE_ME')
      - quay_secret_key | length > 0
      - quay_secret_key is not match('^CHANGE_ME')
      - quay_database_secret_key | length > 0
      - quay_database_secret_key is not match('^CHANGE_ME')
    fail_msg: >-
      Required secrets are missing or still set to CHANGE_ME placeholders.
      From the repo root run: ./scripts/setup-vault.sh
      That creates encrypted inventory/group_vars/quay/vault.yml and .vault_pass.
      Then re-run the playbook.
      Do not commit vault.yml, .vault_pass, or auth.json.

- name: Assert registry credentials or auth file when image pulls are enabled
  when:
    - not (quay_disconnected | bool)
    - quay_pull_images | bool
  ansible.builtin.assert:
    that:
      - >-
        (
          (quay_registry_username | default('') | length) > 0
          and (quay_registry_password | default('') | length) > 0
          and (quay_registry_password is not match('^CHANGE_ME'))
          and (quay_registry_username is not match('^CHANGE_ME'))
        )
        or (quay_registry_auth_file | default('') | length) > 0
        or (quay_registry_auth_file_remote | default('') | length) > 0
    fail_msg: >-
      Image pulls require registry.redhat.io credentials via vault
      (quay_registry_username/password) or an auth.json path.
      For air-gapped hosts use playbooks/deploy_quay_disconnected.yml
      with an offline bundle from ./scripts/download-offline-bundle.sh.
