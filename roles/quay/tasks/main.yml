---
- name: Include prerequisites
  ansible.builtin.include_tasks: prerequisites.yml

- name: Include firewall configuration
  ansible.builtin.include_tasks: firewall.yml

- name: Include directory preparation
  ansible.builtin.include_tasks: directories.yml

- name: Include PostgreSQL deployment
  ansible.builtin.include_tasks: postgres.yml

- name: Include Redis deployment
  ansible.builtin.include_tasks: redis.yml

- name: Include Quay configuration
  ansible.builtin.include_tasks: config.yml

- name: Include Quay registry deployment
  ansible.builtin.include_tasks: quay.yml

- name: Include systemd persistence
  ansible.builtin.include_tasks: systemd.yml

- name: Display Quay endpoint
  ansible.builtin.debug:
    msg:
      - "Quay is available at http://{{ quay_hostname }}:{{ quay_http_port }}/"
      - "Create account '{{ quay_superusers | first | default('quayadmin') }}' in the UI (superuser if configured)."
      - "Login example: podman login --tls-verify=false {{ quay_hostname }}"
      - "Data directory: {{ quay_base_dir }}"
      - "Host OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      - "Images: postgres={{ _quay_postgres_image }}, redis={{ _quay_redis_image }}, quay={{ _quay_image }}"
